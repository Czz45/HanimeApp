[package]
name = "hanime-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "hanime_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
ureq = { version = "2.12", features = ["gzip", "tls"] }
tl = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", optional = true }

[features]
default = []
jni-bridge = ["jni"]

[[bin]]
name = "coretest"
path = "src/bin/coretest.rs"
